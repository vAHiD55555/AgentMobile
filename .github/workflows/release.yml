name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The GitHub-hosted ubuntu runner ships a complete Android SDK here.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    with:
      skip-emu-tests: true
    secrets: inherit

  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------
      # The "zeroclaw" submodule is registered (gitlink committed) and pinned to
      # the version that agentmobile/Cargo.lock requires. "submodules: recursive"
      # checks it out; this step verifies the checked-out version against
      # Cargo.lock and, if the submodule is missing, clones the exact pinned tag.
      # ------------------------------------------------------------------
      - name: Ensure zeroclaw submodule is present
        run: |
          set -euo pipefail
          ZC_LOCK_VER="$(awk '/^name = "zeroclaw"$/{f=1} f && /^version = /{gsub(/[",]/,""); print $3; exit}' agentmobile/Cargo.lock)"
          echo "Cargo.lock pins zeroclaw ${ZC_LOCK_VER}"
          if [ ! -f zeroclaw/Cargo.toml ]; then
            URL="$(git config -f .gitmodules --get submodule.zeroclaw.url || echo https://github.com/zeroclaw-labs/zeroclaw.git)"
            echo "::warning::zeroclaw submodule not checked out; cloning ${URL} at v${ZC_LOCK_VER}"
            rm -rf zeroclaw
            git clone --branch "v${ZC_LOCK_VER}" --depth 1 "$URL" zeroclaw
          fi
          ZC_VER="$(grep -m1 '^version' zeroclaw/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          ZC_COMMIT="$(git -C zeroclaw rev-parse --short HEAD)"
          echo "zeroclaw in tree: v${ZC_VER} (${ZC_COMMIT})"
          if [ "${ZC_VER}" != "${ZC_LOCK_VER}" ]; then
            echo "::error::zeroclaw version mismatch: tree has v${ZC_VER}, Cargo.lock pins v${ZC_LOCK_VER}."
            echo "::error::Pin it with: git -C zeroclaw fetch --tags && git -C zeroclaw checkout v${ZC_LOCK_VER} && git add zeroclaw && git commit && git push"
            exit 1
          fi
          echo "OK: zeroclaw v${ZC_VER} matches Cargo.lock."

      - name: Apply submodule patches (optional)
        run: if ls patches/*.patch 1>/dev/null 2>&1; then cd zeroclaw && git apply ../patches/*.patch; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: the "android-actions/setup-android" action is intentionally NOT used.
      # It runs `sdkmanager tools`, but the legacy "tools" package is no longer
      # published upstream, so the action fails with
      #   "Warning: Failed to find package 'tools'" -> exit code 1
      # on current runner images. The runner already ships a complete Android SDK,
      # so we point the build at it and install only the components we need.
      - name: Set up Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$ANDROID_HOME" || true

      - name: Install Android SDK components (platform, build-tools, NDK)
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentmobile -> target

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # Signing: use the real keystore when the secrets are present, otherwise
      # fall back to an auto-generated debug key so the release APK is still
      # signed and installable (NOT suitable for production / store upload).
      # ------------------------------------------------------------------
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              printf 'RELEASE_STORE_FILE=../release.jks\n'
              printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
              printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
              printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            } >> local.properties
            echo "Using the real release keystore from repository secrets."
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              printf 'RELEASE_STORE_FILE=../debug.keystore\n'
              printf 'RELEASE_STORE_PASSWORD=android\n'
              printf 'RELEASE_KEY_ALIAS=androiddebugkey\n'
              printf 'RELEASE_KEY_PASSWORD=android\n'
            } >> local.properties
            echo "No release keystore found -> signing the release APK with a debug key (NOT for production)."
          fi
          echo "--- local.properties ---"
          cat local.properties

      - name: Build release AAR
        run: ./gradlew :lib:assembleRelease --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and rename release APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced under app/build/outputs/apk/release/"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" app/build/outputs/apk/release/zeroclaw_android.apk
          echo "path=app/build/outputs/apk/release/zeroclaw_android.apk" >> "$GITHUB_OUTPUT"

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks debug.keystore local.properties

      # The publication repository URL in lib/build.gradle.kts points at
      # "AgentMobile-Project/AgentMobile"; if that org/repo does not match the
      # actual repository the publish fails. Keep it non-fatal so a packaging
      # hiccup never blocks the GitHub Release itself.
      - name: Publish AAR to GitHub Packages
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :lib:publishReleasePublicationToGitHubPackagesRepository --no-daemon --stacktrace

      - name: Extract tag version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate tag version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' agentmobile/zeroclaw-ffi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release tag: $TAG"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Detected stable release tag: $TAG"
          fi

      - name: Extract ZeroClaw upstream version
        id: upstream
        run: |
          ZC_VERSION=$(grep '^version' zeroclaw/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          ZC_COMMIT=$(git -C zeroclaw rev-parse --short HEAD)
          echo "version=${ZC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${ZC_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "ZeroClaw upstream: v${ZC_VERSION} (${ZC_COMMIT})"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            --jq '.body' > /tmp/auto-notes.md
          printf '## ZeroClaw Upstream\n' > /tmp/release-notes.md
          printf 'Built against [ZeroClaw](https://github.com/zeroclaw-labs/zeroclaw) v%s (`%s`)\n\n' \
            "${{ steps.upstream.outputs.version }}" "${{ steps.upstream.outputs.commit }}" >> /tmp/release-notes.md
          cat /tmp/auto-notes.md >> /tmp/release-notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.prerelease.outputs.flag }} \
            lib/build/outputs/aar/lib-release.aar \
            app/build/outputs/apk/release/zeroclaw_android.apk
